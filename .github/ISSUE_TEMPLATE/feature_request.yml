name: Feature request
description: 提一个功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看 [docs/roadmap.md](../blob/main/docs/roadmap.md)，
        里面记录了已完成、计划和被否决的想法（尤其是视觉效果的性能取舍）。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及部分
      options:
        - 采集（新设备类型 / 新指标）
        - 前端（页面 / 视觉 / 交互）
        - 部署与配置
        - 文档
        - 其他
  - type: textarea
    id: perf
    attributes:
      label: 性能影响（如涉及前端）
      description: PadDeck 要在 2012 年的 iPad 4 上跑，请说明是否引入 canvas / filter / 每帧重绘
