name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "run: gofmt -w ."; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/paddeck ./cmd/paddeck

      - name: no private files committed
        run: |
          if git ls-files | grep -qiE '^(config\.yaml|config\.local\.yaml|keys/|data/)'; then
            echo "::error::private config or keys are tracked"
            git ls-files | grep -iE '^(config\.yaml|config\.local\.yaml|keys/|data/)'
            exit 1
          fi

      - name: theme files in sync with style.css
        run: |
          python3 tools/themes.py
          git diff --exit-code -- web/theme-*.css web/themes.js
